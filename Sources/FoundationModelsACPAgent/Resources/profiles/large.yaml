# The bundled profile `large`: Qwen3.8 27B at 8 bits with an 8-bit KV cache,
# for a Mac with 48 GB or more. The 8-bit KV cache gives a window of more
# than the minimum window of Router on that Mac. Each key that this file
# leaves out takes the default of Router's `ProfileDefinition`: `flash` is
# the `standard` list, and `embedding`, `decision` and `decisionContext` are
# the defaults of Router.
description: Qwen3.8 27B 8-bit with its MTP drafter, for a Mac with 48 GB or more.
standard:
  - repo: mlx-community/Qwen3.8-27B-8bit
    drafter: mlx-community/Qwen3.8-27B-MTP-8bit
kvBits: 8
