# The bundled profile `small`: a 9B model at 4 bits with an 8-bit KV cache,
# for a Mac with 16 GB or 24 GB. The agent needs 16 GB or more, and this
# profile is for that minimum. The `standard` model is also the default of
# Router, but this file names it, so that the file shows its model. Each key
# that this file leaves out takes the default of Router's
# `ProfileDefinition`: `flash` is the `standard` list, and `embedding`,
# `decision` and `decisionContext` are the defaults of Router.
description: Qwen3.5 9B 4-bit with its MTP drafter and an 8-bit KV cache, for a Mac with 16 GB or 24 GB.
standard:
  - repo: mlx-community/Qwen3.5-9B-4bit
    drafter: mlx-community/Qwen3.5-9B-MTP-4bit
kvBits: 8
