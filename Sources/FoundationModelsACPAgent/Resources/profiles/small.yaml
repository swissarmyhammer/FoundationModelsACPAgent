# The bundled profile `small`: a 9B model at 4 bits with an 8-bit KV cache,
# for a Mac with 16 GB or 24 GB. The agent needs 16 GB or more, and this
# profile is for that minimum. Each key that this file leaves out comes from
# `large`: the `embedding` and the `decision` models.
description: Qwen3.5 9B 4-bit with its MTP drafter and an 8-bit KV cache, for a Mac with 16 GB or 24 GB.
standard:
  - repo: mlx-community/Qwen3.5-9B-4bit
    drafter: mlx-community/Qwen3.5-9B-MTP-4bit
flash:
  - repo: mlx-community/Qwen3.5-9B-4bit
    drafter: mlx-community/Qwen3.5-9B-MTP-4bit
kvBits: 8
