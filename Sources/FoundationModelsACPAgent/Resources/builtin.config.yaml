# The builtin configuration of the agent. This file is layer 1 of the
# configuration stack. The user layer and the project layer are above it.
# A key in a higher layer replaces the same key in this file.
#
# Each tool is on by default. To turn a tool off, set it to false in a
# higher layer, for example:
#
#   tools:
#     web: false
#
# A tool body that is a mapping turns the tool on. The web, git and
# environment bodies also have the "enabled" key.
#
# The skills tool and the agents tool are always on. A layer that sets one
# of them to false gives a warning, and the tool stays on. The agents tool
# has no option, thus this file has no agents section.
#
# Do not put a secret, for example an API key, in this file.
#
# The tests make sure that this file decodes to the defaults in the code
# (AgentConfiguration), and that it names each tool and each option key.
# The appearance that a host applies: system, light or dark. The agent does
# not read it.
theme: system

# The key bindings of the editor of a host: cua (the standard bindings),
# vim or emacs. The agent does not read it.
keymap: cua

# The font of each role of a host. The agent does not read it. Each role
# has a family (the name of the font) and a size in points. An absent key
# means that the host uses its own default, for example:
#
#   fonts:
#     ui:
#       family: SF Pro
#       size: 13
#     display:
#       family: New York
#     code:
#       family: SF Mono
#       size: 12
fonts: {}

# The status line of the chat header of a host. The agent does not read it.
# preset selects a builtin line: default, minimal or full. format is the
# format string of the line. A module key changes one module of the preset.
# The modules are directory, git_branch, git_status, git_state, languages,
# session, agent, model, context and time, for example:
#
#   statusline:
#     preset: minimal
#     directory:
#       truncation_length: 3
statusline:
  preset: default

# The settings of the sessions.
sessions:
  # When true, the agent writes a one-sentence recap of each session with
  # the flash model of the profile (D206). To turn the recap off, set it to
  # false at the user level, or at the session level of a folder for the
  # sessions of that folder only.
  recap: true

# The Core Spotlight items of the app (D214). The app writes and removes the
# items; the agent does not act on these keys. The app uses the user level of
# each key, and the session level of enabled only.
spotlight:
  # When false at the user level, the app writes no item. When false at the
  # session level of a folder, the app writes no item of that folder.
  enabled: true
  # An item for each session.
  sessions: true
  # An item for each archived session too.
  archivedSessions: false
  # An item for each automated session too.
  automatedSessions: false
  # An item for each board and each task.
  tasks: true
  # An item for each agent, skill, rule and MCP server.
  library: true
  # An item for each typed session of another agent.
  externalSessions: true
  # An item for each setting.
  settings: true
  # An item for each command.
  commands: true

tools:
  # The files tools: read, write, search and edit the files of the session.
  files:
    # When true, the tools do not write a file.
    readOnly: false
    # When true, a path can go through a symbolic link.
    allowSymlinks: false
    # When true, the tools record each change of the session.
    recordsChanges: false
    # The gitignore patterns that the search tools skip. When the value is
    # null, the tools skip the dotfolder of the agent, for example
    # ".acp-agent/". An empty list skips no path.
    exclude: null

  # The shell tools: run a command and keep its output.
  shell:
    # The directory for the command output. When the value is null, the
    # shell tools use their own directory.
    storeDirectory: null

  # The skills tool: find and load the skills of the dotfolder stack. This
  # tool is always on.
  skills:
    # The remote skill marketplaces. Each item has a "url" key. The default
    # is the "main" branch of the swissarmyhammer/skills repository. It gives
    # skills and agents. A marketplace URL must use HTTPS. The SSH form is
    # not supported. A session start fetches each marketplace, thus it needs
    # the network. To use the local dotfolder stack only, set an empty list
    # in a higher layer:
    #
    #   tools:
    #     skills:
    #       marketplaces: []
    marketplaces:
      - url: https://github.com/swissarmyhammer/skills.git
        ref: main

  # The code context tools: the symbol index, the call graph and the
  # language servers of the session working directory.
  codeContext:
    # When true, the tools install a language server that is not installed.
    autoInstall: true
    # When true, the index uses the embedding model, and the searchCode
    # verb can rank by meaning.
    semanticSearch: true

  # The web tools: search the web and fetch a page.
  web:
    # When false, the web tools are off.
    enabled: true
    # The API keys of the search providers, by provider name. Put a key in
    # the user layer or in the environment, not in this file. A value
    # keychain:<name> gets the key from the Keychain item <name>.
    apiKeys: {}

  # The git tools: read the repository of the session working directory.
  git:
    # When false, the git tools are off.
    enabled: true

  # The environment tools: read the variables of the agent process, the
  # operating system, and the date and the time. The variables can hold
  # secrets, for example a web API key. The model reads each value that it
  # asks for.
  environment:
    # When false, the environment tools are off.
    enabled: true

  # The kanban tool: read and change the task board of the session working
  # directory. Only a host that has the tool uses this section.
  kanban:
    # When false, the kanban tool is off.
    enabled: true

  # The MCP servers. Each item has a "name" key and a "command" key or a
  # "url" key. An empty list connects only the servers of the client. A
  # value of "env" or "headers" keychain:<name> gets the value from the
  # Keychain item <name>.
  mcp: []
