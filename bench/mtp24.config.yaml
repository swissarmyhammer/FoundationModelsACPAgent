# The agent configuration of the mtp24 run: the tools of noturn24 and
# snapfix1, with MTP (multi-token prediction) on in the standard slot.
#
# Give this file to the run with `--agent-config bench/mtp24.config.yaml`.
# The run writes it to `.acp-agent/config.yaml` in each clone. The 24 ids of
# the run are in `bench/mtp24.ids.txt`, the same ids as noqueue24 and
# noturn24.
#
# - `profile.preset: large` selects the builtin profile `large` (ACPA-21):
#   `mlx-community/Qwen3.8-27B-4bit` with its MTP head
#   `mlx-community/Qwen3.8-27B-MTP-4bit` as the drafter in the standard and
#   flash slots. Before ACPA-21 this file named the model in
#   `profile.standard`; the agent now ignores that key with a warning.
#
# For the notes on each tool group, see bench/snapfix1.config.yaml.
profile:
  preset: large
tools:
  files:
    readOnly: false
    allowSymlinks: false
    recordsChanges: false
  shell:
    storeDirectory: null
  skills:
    marketplaces:
      - url: https://github.com/swissarmyhammer/skills.git
        ref: main
  agents:
    enabled: true
  codeContext:
    autoInstall: true
    semanticSearch: false
  web:
    enabled: true
  git:
    enabled: true
  environment:
    enabled: true
  mcp: []
