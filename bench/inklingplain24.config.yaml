# Model: user-layer profile inklingplain24: mlx-community/Inkling-2-Mini-4bit for standard and flash, fp16 KV, no drafter.
# Build: frozen copy bench/bin/inkling-plain-af9b3cb (ACPAgent 042b3cbf, Router af9b3cbc, Extras 5e43c365, mlx stable 2dafc7c4). Skills main. Live score on.
profile: inklingplain24
tools:
