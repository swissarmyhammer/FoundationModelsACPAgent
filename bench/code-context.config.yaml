# The agent configuration of the "code context with skills" run.
#
# Give this file to the run with `--agent-config bench/code-context.config.yaml`.
# The run writes it to `.acp-agent/config.yaml` in each clone.
#
# The `tools` section names each tool group with its state, in the order of
# the builtin file of the agent
# (Sources/FoundationModelsACPAgent/Resources/builtin.config.yaml). Each group
# is on by default, thus a group that this file does not name is also on. The
# file names each group so that the run states the full tool set, and not
# only the groups that differ from the default. A group body that is a mapping
# turns the group on. Only `web` and `git` also have the `enabled` key.
#
# - `files` is the Multitool group `tools.files`. The keys are the builtin
#   defaults. `exclude` is not set: the default skips the dotfolder of the
#   agent, `.acp-agent/`, which holds the transcripts.
# - `shell` is the Multitool group `tools.shell`, with the builtin defaults.
# - `skills` is the stand-alone `skills` tool. It reads the `code-context`
#   branch of the skills marketplace, which holds only the five skills that
#   need the code context tool. The URL is the HTTPS form: the agent of a
#   run gets a clean environment, and the HTTPS form of this public
#   repository needs no SSH agent and no credential.
# - `codeContext` is the Multitool group `tools.code_context`. It is on by
#   default; the entry is here so that the run states it.
#   `semanticSearch: false` stops the embedding pass of the index. Each
#   instance is a new clone, thus each instance makes a new index. On
#   2026-09-18 the django clone had 44,532 chunks, and the embedder of the
#   profile did 273 of them in 8 minutes, on the same GPU as the model. The
#   symbol, call graph, blast radius and language server verbs need no
#   embedding. Only `searchCode` does, and with this key it answers with an
#   error that says the embedding layer is off.
# - `web` is the Multitool group `tools.web` (search and fetch). It is on by
#   default, and this run sets `enabled: true` to state it. No key is
#   necessary: with no key, the providers are the keyless pages of Brave
#   and DuckDuckGo. A web search can find the upstream fix of the issue. The
#   web tool is part of the agent, so a fix that the agent finds and uses is
#   a valid result. A run with web off uses different tools, so a comparison
#   with it is a comparison of two configurations. The file does not set
#   `apiKeys`: a key must not be in this file, and an empty map here would
#   replace the keys of the user layer.
# - `git` is the Multitool group `tools.git` (status, changes, diff, log,
#   show, blame, commit, branches). It is on by default, and this run sets
#   `enabled: true` to state it. The clone of an instance has the full
#   history, also the commits after the base commit. Thus a git read of a
#   later rev, for example `main`, can find the upstream fix. As for the web
#   tool, a fix that the agent finds that way is a valid result. The run
#   records each such read (`git_upstream_reads` in the record), and the score
#   report marks it in the upstream-fix column.
# - `mcp` is the list of the MCP servers. The list is empty: this file adds
#   no MCP server.
#
# No `compaction.toolOutputLimit`. A cap on a tool result keeps the first N
# tokens and drops the rest before the model reads it: a file read loses its
# end, a grep its later matches, a test run its failure summary. It is not
# compaction, which must shrink OLD results after they have done their job.
# The run of 2026-09-23 used a cap of 1,500 tokens: django__django-13964 got
# a patch where it had none, but by the spacing of the results, not by
# design. It took 67 rounds against 41, and the cap cut the grepCode answer
# under study. A model that loses the end of a result must ask for it again.
# The real fix is a fold at each append, in Router (cards ^9ddjkjm,
# ^46bz58k).
tools:
  files:
    readOnly: false
    allowSymlinks: false
    recordsChanges: false
  shell:
    storeDirectory: null
  skills:
    marketplaces:
      - url: https://github.com/swissarmyhammer/skills.git
        ref: code-context
  codeContext:
    autoInstall: true
    semanticSearch: false
  web:
    enabled: true
  git:
    enabled: true
  mcp: []
