# The agent configuration of the "code context with skills" run.
#
# Give this file to the run with `--agent-config bench/code-context.config.yaml`.
# The run writes it to `.acp-agent/config.yaml` in each clone.
#
# - `skills` is the stand-alone `skills` tool. It reads the `code-context`
#   branch of the skills marketplace, which holds only the five skills that
#   need the code context tool. The URL is the HTTPS form: the agent of a
#   run gets a clean environment, and the HTTPS form of this public
#   repository needs no SSH agent and no credential.
# - `codeContext` is the Multitool group `tools.code_context`. It is on by
#   default; the entry is here so that the run states it.
#   `semanticSearch: false` stops the embedding pass of the index. Each
#   instance is a new clone, thus each instance makes a new index. On
#   2026-09-18 the django clone had 44,532 chunks, and the embedder of the
#   profile did 273 of them in 8 minutes, on the same GPU as the model. The
#   symbol, call graph, blast radius and language server verbs need no
#   embedding. Only `searchCode` does, and with this key it answers with an
#   error that says the embedding layer is off.
#
# `compaction.toolOutputLimit` caps each tool result at the tool-instancing
# seam, before the model and before the transcript. It is the one cap that
# works INSIDE a turn. One instance is one prompt, thus one turn, and the
# automatic fold runs only at the start of a turn: a turn of 41 model rounds
# never folds, however full the context gets.
#
# Measured on the run of 2026-09-21, instance django__django-13964: the
# conversation reached about 225,000 tokens of the 262,144 window. The tool
# results were 119,000 of them (162 results, the largest about 2,900 tokens)
# and the reasoning was 99,000. The last round then ran into the ceiling in
# one long reasoning block, the turn ended `_truncated`, and the patch was
# empty. A cap of 1,500 tokens holds each result to about two screens of
# text, and the marker tells the model that the result was cut.
compaction:
  toolOutputLimit: 1500

tools:
  skills:
    marketplaces:
      - url: https://github.com/swissarmyhammer/skills.git
        ref: code-context
  codeContext:
    autoInstall: true
    semanticSearch: false
