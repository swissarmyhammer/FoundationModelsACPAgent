"""
A point in time: RFC 3339 text in UTC with milliseconds, like 2026-10-06T14:49:10.690Z.
"""
scalar DateTime

"""Any JSON value. The keys of each object are in sorted order."""
scalar JSON

"""A level that a mutation changes."""
enum SettingLevel {
  """The user level. It applies to each session."""
  USER

  """The session level of one working directory. It wins over USER."""
  SESSION
}

"""The layer that set a merged value."""
enum SettingLayer {
  """The builtin configuration of the agent."""
  BUILTIN

  """A cached remote skill marketplace."""
  MARKETPLACE

  """The defaults folder of the host."""
  DEFAULTS

  """The user level."""
  USER

  """The session level of the working directory."""
  SESSION
}

"""
One secret key inside a setting. The endpoint never gives a secret value.
"""
type Secret {
  """The dotted key path of the secret key."""
  keyPath: String!

  """
  The name of the keychain: reference, or null for a literal that is not shown.
  """
  reference: String

  """
  True when the secret store has an item for the reference. Null in the result of a mutation when the secret store could not read the item: the value is unknown.
  """
  hasValue: Boolean
}

"""
The merged value of one key for a session, or of the USER level when no cwd applies, and the layer that set it.
"""
type Setting {
  """The key path of the setting."""
  keyPath: [String!]!

  """The merged value. A literal secret shows as <redacted>."""
  value: JSON

  """The layer that set the value."""
  level: SettingLayer!

  """Each secret key inside the value."""
  secrets: [Secret!]!
}

"""One change of the settings."""
type SettingsChange {
  """The level that changed."""
  level: SettingLevel!

  """The working directory of a session level, or null for the user level."""
  cwd: String

  """
  The changed key path, or null when the file of the level changed. Read it again.
  """
  keyPath: [String!]
}

type Query {
  """The sections of the settings: the first key of each key path."""
  sections: [String!]!

  """
  The merged value of one key for a session, or of the USER level when no cwd applies, or null when no layer has the key.
  """
  setting(
    """
    The keys from the root, for example ["compaction", "trigger"]. The first key is a section.
    """
    keyPath: [String!]!

    """
    The absolute path of the working directory of the session. It names the session level. A call of the settings endpoint can omit it: then a read gives the USER level over the builtin layers, a USER change needs no cwd, and a SESSION change is refused. The settings tool of a session can omit it: the folder of that session applies, and a different folder is refused.
    """
    cwd: String
  ): Setting
}

type Mutation {
  """
  Sets the value of one key on one level. The merged setting after the change, or null when no layer has the key. The change is saved before the read of this result. When that read does not complete, the mutation does not fail: a part that the read could not get is null, and extensions.warnings has the code READ_AFTER_CHANGE_INCOMPLETE.
  """
  set(
    """
    The keys from the root, for example ["compaction", "trigger"]. The first key is a section.
    """
    keyPath: [String!]!

    """The new value. A secret key takes only a keychain:<name> reference."""
    value: JSON!

    """The level that the mutation changes."""
    level: SettingLevel!

    """
    The absolute path of the working directory of the session. It names the session level. A call of the settings endpoint can omit it: then a read gives the USER level over the builtin layers, a USER change needs no cwd, and a SESSION change is refused. The settings tool of a session can omit it: the folder of that session applies, and a different folder is refused.
    """
    cwd: String
  ): Setting

  """
  Removes one key from one level. The value of a lower level applies again. The merged setting after the change, or null when no layer has the key. The change is saved before the read of this result. When that read does not complete, the mutation does not fail: a part that the read could not get is null, and extensions.warnings has the code READ_AFTER_CHANGE_INCOMPLETE.
  """
  clear(
    """
    The keys from the root, for example ["compaction", "trigger"]. The first key is a section.
    """
    keyPath: [String!]!

    """The level that the mutation changes."""
    level: SettingLevel!

    """
    The absolute path of the working directory of the session. It names the session level. A call of the settings endpoint can omit it: then a read gives the USER level over the builtin layers, a USER change needs no cwd, and a SESSION change is refused. The settings tool of a session can omit it: the folder of that session applies, and a different folder is refused.
    """
    cwd: String
  ): Setting
}

type Subscription {
  """
  Each change of the settings, from a mutation or from a change of a file. With no cwd, only the changes of USER.
  """
  changes(
    """
    The working directory whose session level to watch, or null for the changes of USER only.
    """
    cwd: String
  ): SettingsChange!
}
