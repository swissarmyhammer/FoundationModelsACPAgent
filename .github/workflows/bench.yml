name: Bench

# The tests of the Python harness below `bench/`.
#
# `bench/swebench_run.py` drives SWE-bench, `bench/swebench_env.py` makes the
# environment that the process of the agent gets,
# `bench/swebench_prediction.py` makes the prediction row of an instance,
# `bench/swebench_record.py` makes the record row of an instance,
# `bench/swebench_venv.py` builds the Python environment of an instance,
# `bench/swebench_docker.py` asks the docker daemon whether it answers,
# `bench/swebench_event.py` makes the line of one milestone, and
# `bench/swebench_report.py` makes the report of a score run. A defect
# there costs a whole drive of the dataset, and no Swift target reads that
# code. So the tests of the harness have a job of their own here. A test
# target that no CI task runs gives no protection.
#
# This job runs the unit tests of the harness alone. It starts no agent, it
# clones no repository of an instance, and it loads no model, so it is quick
# and it is deterministic. The tests need the standard library of Python
# only, and the runner has that, so the job installs nothing.
#
# The step below FINDS the tests, and it does not name them. A new
# `bench/test_*.py` file thus runs here on the day a person writes it, and no
# person must remember to add a step for it.
#
# `ci.yml` stays as it is: it delegates to the shared Swift workflow, and
# `CIWorkflowTests` pins that delegation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Bench harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the harness
        run: >
          python3 -m unittest discover
          --start-directory bench --pattern 'test_*.py' --verbose
